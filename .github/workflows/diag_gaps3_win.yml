name: diag gaps3 windows

# cx-home/v#20 (gaps3): mt_sound exits 139 after bad=0 on Windows gcc (diagnostic branch, not for the pin).
on:
  push:
    branches:
      - 'diag/gaps3-win**'

jobs:
  win:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build V
        shell: pwsh
        run: .\makev.bat -gcc
      - name: exit-path probes
        shell: pwsh
        continue-on-error: true
        run: |
          .\v.exe -cc gcc -gc e -g -o mts_a.exe bench/parallel-alloc/concurrent_mt_sound/mt_sound.v
          .\v.exe -cc gcc -gc e -g -cflags -DVGC_NO_FLS_EXIT -o mts_b.exe bench/parallel-alloc/concurrent_mt_sound/mt_sound.v
          .\v.exe -cc gcc -gc e -g -o c3.exe diag/c3.v
          foreach ($exe in 'c3', 'mts_a', 'mts_b') {
            foreach ($t in 1, 2, 8) {
              "=== $exe T=$t"
              $env:T = "$t"; $env:STEPS = '4000'
              $p = Start-Process -FilePath ".\$exe.exe" -NoNewWindow -PassThru -RedirectStandardOutput "o.txt" -RedirectStandardError "e.txt"
              $done = $p.WaitForExit(60000)
              if (-not $done) { "HUNG"; Stop-Process -Id $p.Id -Force } else { "exit=$($p.ExitCode)" }
              Get-Content o.txt -Tail 3
              Get-Content e.txt -Tail 12
            }
          }

name: diag gaps3 windows

# cx-home/v#22 (gaps3): vgc under msvc (diagnostic branch, not for the pin).
on:
  push:
    branches:
      - 'diag/gaps3-win**'

jobs:
  win:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build V
        shell: pwsh
        run: .\makev.bat -msvc
      - name: msvc vgc
        shell: pwsh
        continue-on-error: true
        run: |
          .\v.exe -cc msvc -gc e test bench/parallel-alloc/vgc_os_suspend_port_test.v bench/parallel-alloc/vgc_global_root_test.v 2>&1 | Select-Object -Last 40
          .\v.exe -cc msvc -gc e -o mts.exe bench/parallel-alloc/concurrent_mt_sound/mt_sound.v 2>&1 | Select-Object -Last 40
          foreach ($t in 2, 8) {
            "=== T=$t"
            $env:T = "$t"; $env:STEPS = '20000'
            $p = Start-Process -FilePath .\mts.exe -NoNewWindow -PassThru -RedirectStandardOutput "o.txt" -RedirectStandardError "e.txt"
            $done = $p.WaitForExit(90000)
            if (-not $done) { "HUNG"; Stop-Process -Id $p.Id -Force } else { "exit=$($p.ExitCode)" }
            Get-Content o.txt -Tail 3
            Get-Content e.txt -Tail 12
          }

name: diag gaps3 windows

# cx-home/v#20 (gaps3): why mt_sound under vgc does not finish on Windows (diagnostic branch, not for the pin).
on:
  push:
    branches:
      - 'diag/gaps3-win**'

jobs:
  win:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build V
        shell: pwsh
        run: .\makev.bat -gcc
      - name: gc_collect probes
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($c in 'c1', 'c2') {
            .\v.exe -cc gcc -gc e -g -o "$c.exe" "diag/$c.v"
            "=== $c"
            $env:VGC_GCTRACE = '2'
            $p = Start-Process -FilePath ".\$c.exe" -NoNewWindow -PassThru -RedirectStandardOutput "o$c.txt" -RedirectStandardError "e$c.txt"
            $done = $p.WaitForExit(30000)
            if (-not $done) { "HUNG after 30 s"; Stop-Process -Id $p.Id -Force } else { "exit=$($p.ExitCode)" }
            Get-Content "o$c.txt" -Tail 5
            Get-Content "e$c.txt" -TotalCount 40
          }
      - name: mt_sound watched
        shell: pwsh
        continue-on-error: true
        run: |
          .\v.exe -cc gcc -gc e -g -o mts.exe bench/parallel-alloc/concurrent_mt_sound/mt_sound.v
          foreach ($t in 1) {
            "=== T=$t"
            $env:T = "$t"; $env:STEPS = '2000'; $env:VGC_GCTRACE = '2'
            $p = Start-Process -FilePath .\mts.exe -NoNewWindow -PassThru -RedirectStandardOutput "o$t.txt" -RedirectStandardError "e$t.txt"
            $done = $p.WaitForExit(45000)
            if (-not $done) { "HUNG after 45 s"; Stop-Process -Id $p.Id -Force } else { "exit=$($p.ExitCode)" }
            "--- stdout tail"; Get-Content "o$t.txt" -Tail 5
            "--- stderr head"; Get-Content "e$t.txt" -TotalCount 25
            "--- stderr tail"; Get-Content "e$t.txt" -Tail 25
          }

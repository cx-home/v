name: diag gaps3 windows

# cx-home/v#22 (gaps3): vgc under msvc (diagnostic branch, not for the pin).
on:
  push:
    branches:
      - 'diag/gaps3-win**'

jobs:
  win:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build V
        shell: pwsh
        run: .\makev.bat -msvc
      - name: msvc vgc T=8 under cdb
        shell: pwsh
        continue-on-error: true
        run: |
          .\v.exe -cc msvc -gc e -g -o mts.exe bench/parallel-alloc/concurrent_mt_sound/mt_sound.v 2>&1 | Select-Object -Last 20
          $cdb = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          "cdb: $($cdb.FullName)"
          $env:T = '8'; $env:STEPS = '20000'
          foreach ($i in 1, 2, 3) {
            "=== run $i"
            & $cdb.FullName -g -G -o -c ".symfix+ ; .reload /f mts.exe ; g ; .ecxr ; kn 25 ; r ; ~*kn 8 ; q" .\mts.exe 2>&1 | Select-String -Pattern 'Access violation|mts!|^ *[0-9a-f]{2} |rax=|rip=|rsp=|exception|mt_sound' | Select-Object -First 80
          }

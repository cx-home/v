name: diag gaps3 v17

on:
  push:
    branches:
      - 'diag/gaps3-**'

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build V
        run: make -j4
      - name: diag
        run: sh diag/run.sh 2>&1 || true

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Start FreeBSD VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          version: '15.1'
          memory: 8G
          cpu_count: 4
          shell: sh
          sync_files: runner-to-vm
      - name: diag on FreeBSD
        shell: cpa.sh {0}
        run: |
          sudo pkg install -y git gmake
          git config --global --add safe.directory .
          gmake
          sh diag/run.sh 2>&1 || true

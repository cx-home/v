name: CI vgc

# The cx patches' collector tests (bench/parallel-alloc: the parallel marker,
# the fork child path, the pacer, the grow gate) on Linux and FreeBSD.
# Runs on every push to a cx fix branch or a cx-patches branch, before
# cx-private pins it (cx-home/v#16).

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
      - 'cx-patches-*'

jobs:
  vgc-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build V
        run: make -j4 && ./v symlink
      - name: bench/parallel-alloc (default)
        run: ./v test bench/parallel-alloc
      - name: bench/parallel-alloc (markers forced)
        run: VGC_MARK_PAR_MIN_US=0 ./v test bench/parallel-alloc

  vgc-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Start FreeBSD VM
        id: vm-freebsd
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          version: '15.1'
          memory: 8G
          cpu_count: 4
          shell: sh
          sync_files: runner-to-vm
      - name: bench/parallel-alloc on FreeBSD
        shell: cpa.sh {0}
        run: |
          sudo pkg install -y git gmake
          sudo hostname -s freebsd-ci
          git config --global --add safe.directory .
          gmake
          ./v test bench/parallel-alloc
          VGC_MARK_PAR_MIN_US=0 ./v test bench/parallel-alloc

  # cx-home/v#20: the Windows OS-suspend STW (SuspendThread + GetThreadContext),
  # the stack bounds and the thread-exit callback. bench/parallel-alloc's
  # drivers spawn children through `ENV=v cmd`, which cmd.exe does not read,
  # so this job runs the port test and the soundness driver directly. -gc e
  # is explicit: an msvc build defaults to no GC.
  vgc-windows:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, msvc]
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build V (${{ matrix.cc }})
        shell: pwsh
        run: |
          if ('${{ matrix.cc }}' -eq 'msvc') { .\makev.bat -msvc } else { .\makev.bat -gcc }
          .\v.exe version
      - name: vgc_os_suspend_port_test
        shell: pwsh
        run: .\v.exe -cc ${{ matrix.cc }} -gc e test bench/parallel-alloc/vgc_os_suspend_port_test.v
      - name: concurrent_mt_sound T=8 and T=16 (default collector)
        shell: pwsh
        timeout-minutes: 10
        run: |
          .\v.exe -cc ${{ matrix.cc }} -gc e -o mts.exe bench/parallel-alloc/concurrent_mt_sound/mt_sound.v
          foreach ($t in 8, 16) {
            $env:T = "$t"; $env:STEPS = '20000'
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $out = (.\mts.exe 2>&1 | Out-String)
            $code = $LASTEXITCODE
            "T=$t exit=$code secs=$($sw.Elapsed.TotalSeconds)"
            $out.Trim().Split("`n") | Select-Object -Last 3
            if ($code -ne 0 -or $out -notmatch ' bad=0') { throw "mt_sound T=$t unsound or failed" }
          }

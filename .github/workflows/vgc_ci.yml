name: CI vgc

# The cx patches' collector tests (bench/parallel-alloc: the parallel marker,
# the fork child path, the pacer, the grow gate) on Linux and FreeBSD.
# Runs on every push to a cx fix branch or a cx-patches branch, before
# cx-private pins it (cx-home/v#16).

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
      - 'cx-patches-*'

jobs:
  vgc-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build V
        run: make -j4 && ./v symlink
      - name: bench/parallel-alloc (default)
        run: ./v test bench/parallel-alloc
      - name: bench/parallel-alloc (markers forced)
        if: ${{ !cancelled() }}
        run: VGC_MARK_PAR_MIN_US=0 ./v test bench/parallel-alloc
      # cx-home/v#16: clear, count and the sweep's bit work on the marker pool
      # stay serial on a small or oversubscribed box (the load gate); this run
      # forces the parallel walks on every collection so they are tested here.
      # One test at a time (VJOBS=1): with the load gate lifted, eight walkers per
      # test on a 4-vCPU runner beside three other tests put the pacing-ratio
      # tests' pause/carve bounds (grow_gate_growing, refute_tiny_gate) past
      # their limits on 38046128855; the soundness the run is for does not
      # need the box shared.
      - name: bench/parallel-alloc (walks forced)
        if: ${{ !cancelled() }}
        run: VJOBS=1 VGC_MARK_PAR_MIN_US=0 VGC_WALK_WORKERS=8 VGC_WALK_PAR_MIN_SPANS=64 VGC_WALK_LOAD_GATE=0 ./v test bench/parallel-alloc

  # cx-home/v#51 guard: the parallel sweep test, built with -d vgc_rootdiag, run
  # 400 times in one job. A 1-in-80 mismatch (a stale stack word keeping an
  # arena-base buffer) needs hundreds of runs to show; a failure prints the last
  # cycle's root words with their kind, address and frame, so the word is named
  # by the run that finds it (0 of 1,200 after the fix; 20 of 1,600 before it).
  v51-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build V
        run: make -j4 && ./v symlink
      - name: vgc_parallel_sweep_test x400 (-d vgc_rootdiag)
        if: ${{ !cancelled() }}
        run: |
          ./v -d vgc_rootdiag -skip-running -o ps_rd bench/parallel-alloc/vgc_parallel_sweep_test.v
          fails=0
          for i in $(seq 1 400); do
            if [ $((i % 2)) = 0 ]; then export VGC_MARK_PAR_MIN_US=0; mp=0; else unset VGC_MARK_PAR_MIN_US; mp=default; fi
            if ! VGC_ROOTDIAG_MIN_KB=1 ./ps_rd > out.txt 2>&1; then
              fails=$((fails+1))
              echo "== FAIL run $i (VGC_MARK_PAR_MIN_US=$mp)"
              grep -v '^\[rootdiag' out.txt | head -c 30000
            fi
          done
          echo "v51 loop: $fails of 400 runs failed"
          test $fails = 0

  vgc-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - name: Start FreeBSD VM
        id: vm-freebsd
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          version: '15.1'
          memory: 8G
          cpu_count: 4
          shell: sh
          sync_files: runner-to-vm
      - name: bench/parallel-alloc on FreeBSD
        shell: cpa.sh {0}
        run: |
          sudo pkg install -y git gmake
          sudo hostname -s freebsd-ci
          git config --global --add safe.directory .
          gmake
          sysctl kern.threads.max_threads_per_proc hw.ncpu
          # cx-home/v#24: the idle-run coalesce row, traced, before the suite
          VGC_GCTRACE=2 ./v -stats test bench/parallel-alloc/vgc_idle_defrag_test.v 2>&1 | tail -80 || true
          # every mode reports, then the job fails if any did
          rc=0
          ./v test bench/parallel-alloc || rc=1
          VGC_MARK_PAR_MIN_US=0 ./v test bench/parallel-alloc || rc=1
          VJOBS=1 VGC_MARK_PAR_MIN_US=0 VGC_WALK_WORKERS=8 VGC_WALK_PAR_MIN_SPANS=64 VGC_WALK_LOAD_GATE=0 ./v test bench/parallel-alloc || rc=1
          exit $rc

  # cx-home/v#20: the Windows OS-suspend STW (SuspendThread + GetThreadContext),
  # the stack bounds and the thread-exit callback. bench/parallel-alloc's
  # drivers spawn children through `ENV=v cmd`, which cmd.exe does not read,
  # so this job runs the port test and the soundness driver directly.
  vgc-windows:
    strategy:
      fail-fast: false
      matrix:
        # cx-home/v#22: msvc compiles vgc (intrinsic arms for the SP read, pause,
        # fences and the keep-alive barrier), so it runs the same rows as gcc.
        cc: [gcc, msvc]
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build V (${{ matrix.cc }})
        shell: pwsh
        run: |
          .\makev.bat -${{ matrix.cc }}
          .\v.exe version
      - name: vgc_os_suspend_port_test, vgc_global_root_test
        shell: pwsh
        run: .\v.exe -cc ${{ matrix.cc }} -gc e test bench/parallel-alloc/vgc_os_suspend_port_test.v bench/parallel-alloc/vgc_global_root_test.v
      - name: concurrent_mt_sound T=8 and T=16 (default collector)
        shell: pwsh
        timeout-minutes: 10
        run: |
          .\v.exe -cc ${{ matrix.cc }} -gc e -o mts.exe bench/parallel-alloc/concurrent_mt_sound/mt_sound.v
          foreach ($t in 8, 16) {
            $env:T = "$t"; $env:STEPS = '20000'
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $out = (.\mts.exe 2>&1 | Out-String)
            $code = $LASTEXITCODE
            "T=$t exit=$code secs=$($sw.Elapsed.TotalSeconds)"
            $out.Trim().Split("`n") | Select-Object -Last 3
            if ($code -ne 0 -or $out -notmatch ' bad=0') { throw "mt_sound T=$t unsound or failed" }
          }
